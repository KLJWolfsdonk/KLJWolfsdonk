<!doctype html>
<html lang="nl">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>
KLJ Wolfsdonk Admin | Over
</title>

<link rel="stylesheet" href="./admin.css">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css">

<script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

<script type="module" src="./over.js"></script>

</head>


<body>

<main class="admin-shell">

<header class="hero card">
<div class="hero-actions">
<div>
<p class="eyebrow">KLJ Wolfsdonk</p>
<h1>Over</h1>
<p>Beheer de 3 tabbladen van de "Praktische informatie"-pagina.</p>
</div>
<div class="hero-nav">
<a href="./pages.html" class="ghost-button">Pagina's</a>
<a href="./index.html" class="ghost-button">Reservaties</a>
<a href="./products.html" class="ghost-button">Producten</a>
<a href="./navigation.html" class="ghost-button">Navigatie</a>
<a href="./signature.html" class="ghost-button">Handtekening</a>
<button type="button" id="logout-button" class="ghost-button" hidden>Uitloggen</button>
</div>
</div>
</header>


<section class="card">

<h2>Praktisch</h2>

<form id="praktisch-form">

	<label class="field-group">
		<span>Titel</span>
		<input id="praktisch-title">
	</label>

	<div style="height: 1rem;"></div>

	<div id="praktisch-editor"></div>

	<div style="height: 1.25rem;"></div>

	<p id="praktisch-error" class="error-message" hidden></p>

	<button type="submit" class="ghost-button">Opslaan</button>

</form>

</section>


<section class="card">

<h2>Wat is KLJ Wolfsdonk?</h2>

<form id="klj-form">

	<label class="field-group">
		<span>Titel</span>
		<input id="klj-title">
	</label>

	<div style="height: 1rem;"></div>

	<div id="klj-editor"></div>

	<div style="height: 1.25rem;"></div>

	<p id="klj-error" class="error-message" hidden></p>

	<button type="submit" class="ghost-button">Opslaan</button>

</form>

</section>


<section class="card">

<h2>Extra info</h2>

<form id="extra-form">

	<label class="field-group">
		<span>Titel</span>
		<input id="extra-title">
	</label>

	<div style="height: 1rem;"></div>

	<div id="extra-editor"></div>

	<div style="height: 1.25rem;"></div>

	<p id="extra-error" class="error-message" hidden></p>

	<button type="submit" class="ghost-button">Opslaan</button>

</form>

</section>

</main>


</body>

</html>
