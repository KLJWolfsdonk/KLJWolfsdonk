<!doctype html>
<html lang="nl">

<head>

<meta charset="utf-8">

<title>
KLJ Wolfsdonk Admin
</title>

<link rel="stylesheet" href="./admin.css">

<script type="module" src="./admin.js"></script>

</head>


<body>

<main class="admin-shell">

<header class="hero card">
<div class="hero-actions">
<div>
<p class="eyebrow">KLJ Wolfsdonk</p>
<h1>Reservaties</h1>
<p>Beheer aanvragen, bevestig boekingen en volg de status van elke reservatie op.</p>
</div>
<div class="hero-nav">
<a href="./products.html" class="ghost-button">Producten</a>
<button type="button" id="logout-button" class="ghost-button" hidden>Uitloggen</button>
</div>
</div>
</header>


<section class="reservation-controls card toolbar">

	<label class="field-group">
		<span>Zoeken</span>
		<input
			type="search"
			id="reservation-search"
			placeholder="Zoek op naam, email, telefoon..."
		>
	</label>

	<label class="field-group">
		<span>Filter</span>
		<select id="reservation-filter">


			<option value="alle">
				Alle reservaties
			</option>


			<option value="aanvraag">
				Aanvragen
			</option>


			<option value="bevestigd">
				Bevestigd
			</option>


			<option value="geweigerd">
				Geweigerd
			</option>


			<option value="voltooid">
				Voltooid
			</option>


		</select>
	</label>

</section>



<div id="reservation-list"></div>

</main>


</body>

</html>
