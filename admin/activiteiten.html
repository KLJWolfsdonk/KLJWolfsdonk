<!doctype html>
<html lang="nl">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>
KLJ Wolfsdonk Admin | Activiteiten
</title>

<link rel="stylesheet" href="./admin.css">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css">

<script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

<script type="module" src="./activiteiten.js"></script>

</head>


<body>

<main class="admin-shell">

<header class="hero card">
<div class="hero-actions">
<div>
<p class="eyebrow">KLJ Wolfsdonk</p>
<h1>Activiteiten</h1>
<p>Beheer de uitleg en de specialere activiteiten van deze pagina.</p>
</div>
<div class="hero-nav">
<a href="./pages.html" class="ghost-button">Pagina's</a>
<a href="./index.html" class="ghost-button">Reservaties</a>
<a href="./products.html" class="ghost-button">Producten</a>
<a href="./navigation.html" class="ghost-button">Navigatie</a>
<a href="./signature.html" class="ghost-button">Handtekening</a>
<button type="button" id="logout-button" class="ghost-button" hidden>Uitloggen</button>
</div>
</div>
</header>


<section class="card">

<h2>Uitleg</h2>

<form id="uitleg-form">

	<label class="field-group">
		<span>Titel</span>
		<input id="uitleg-title">
	</label>

	<div style="height: 1rem;"></div>

	<div id="uitleg-editor"></div>

	<div style="height: 1.25rem;"></div>

	<p id="uitleg-error" class="error-message" hidden></p>

	<button type="submit" class="ghost-button">Opslaan</button>

</form>

</section>


<section class="card">

<h2>Nieuwe post (specialere activiteit)</h2>

<form id="post-form">

	<label class="field-group">
		<span>Titel</span>
		<input id="new-titel" required>
	</label>

	<div style="height: 1rem;"></div>

	<div class="inline-fields">

		<label class="field-group">
			<span>Datum</span>
			<input id="new-datum" type="date" required>
		</label>

		<label class="field-group field-group--checkbox">
			<input type="checkbox" id="new-gepubliceerd" checked>
			<span>Publiceren</span>
		</label>

	</div>

	<div style="height: 1rem;"></div>

	<div class="inline-fields">

		<label class="field-group">
			<span>Cover afbeelding</span>
			<input id="new-cover" type="file" accept="image/*">
		</label>

		<label class="field-group">
			<span>Grootte afbeelding</span>
			<select id="new-cover-breedte">
				<option value="33">Klein</option>
				<option value="50">Middel</option>
				<option value="75">Groot</option>
				<option value="100" selected>Volledige breedte</option>
			</select>
		</label>

	</div>

	<div style="height: 1rem;"></div>

	<label class="field-group">
		<span>Inhoud</span>
		<div id="new-inhoud-editor"></div>
	</label>

	<div style="height: 1.25rem;"></div>

	<p id="post-form-error" class="error-message" hidden></p>

	<button type="submit" class="ghost-button">Toevoegen</button>

</form>

</section>


<div id="post-manager-list"></div>

</main>


</body>

</html>
