<!doctype html>
<html lang="nl">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>
KLJ Wolfsdonk Admin | Leiding
</title>

<link rel="stylesheet" href="./admin.css">

<script type="module" src="./leiding.js"></script>

</head>


<body>

<main class="admin-shell">

<header class="hero card">
<div class="hero-actions">
<div>
<p class="eyebrow">KLJ Wolfsdonk <span class="group-tag group-tag--sitebeheer">Sitebeheer</span></p>
<h1>Leiding</h1>
<p>Beheer de groepen (tabbladen) en de leiding-leden op de Leiding-pagina.</p>
</div>
<div class="hero-nav">
<nav class="nav-group nav-group--verhuur" aria-label="Verhuur beheer">
<span class="nav-group-label">Verhuur</span>
<a href="./index.html" class="ghost-button">Reservaties</a>
<a href="./products.html" class="ghost-button">Producten</a>
<a href="./signature.html" class="ghost-button">Handtekening</a>
</nav>
<nav class="nav-group nav-group--sitebeheer" aria-label="Sitebeheer">
<span class="nav-group-label">Sitebeheer</span>
<a href="./pages.html" class="ghost-button">Pagina's</a>
<a href="./navigation.html" class="ghost-button">Navigatie</a>
</nav>
<button type="button" id="logout-button" class="ghost-button" hidden>Uitloggen</button>
</div>
</div>
</header>


<section class="card">

<h2>Nieuwe groep</h2>

<form id="groep-form">

	<div class="inline-fields">

		<label class="field-group">
			<span>Naam</span>
			<input id="new-groep-naam" required placeholder="bv. Wolfkes">
		</label>

		<label class="field-group">
			<span>Groepsfoto (optioneel)</span>
			<input id="new-groep-foto" type="file" accept="image/*">
		</label>

	</div>

	<div style="height: 1.25rem;"></div>

	<p id="groep-form-error" class="error-message" hidden></p>

	<button type="submit" class="ghost-button">Toevoegen</button>

</form>

</section>


<div id="leiding-groepen-list"></div>

</main>


</body>

</html>
