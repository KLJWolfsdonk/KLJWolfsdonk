<!doctype html>
<html lang="nl">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>
KLJ Wolfsdonk Admin | Sponsors
</title>

<link rel="stylesheet" href="./admin.css">

<script type="module" src="./sponsors.js"></script>

</head>


<body>

<main class="admin-shell">

<header class="hero card">
<div class="hero-actions">
<div>
<p class="eyebrow">KLJ Wolfsdonk</p>
<h1>Sponsors</h1>
<p>Beheer de sponsorlogo's op de Sponsors-pagina.</p>
</div>
<div class="hero-nav">
<a href="./pages.html" class="ghost-button">Pagina's</a>
<a href="./index.html" class="ghost-button">Reservaties</a>
<a href="./products.html" class="ghost-button">Producten</a>
<a href="./navigation.html" class="ghost-button">Navigatie</a>
<a href="./signature.html" class="ghost-button">Handtekening</a>
<button type="button" id="logout-button" class="ghost-button" hidden>Uitloggen</button>
</div>
</div>
</header>


<section class="card">

<h2>Nieuwe sponsor</h2>

<form id="sponsor-form">

	<label class="field-group">
		<span>Naam</span>
		<input id="new-sponsor-naam" required placeholder="bv. Bakkerij Janssens">
	</label>

	<div style="height: 1rem;"></div>

	<label class="field-group">
		<span>Logo</span>
		<input id="new-sponsor-logo" type="file" accept="image/*" required>
	</label>

	<div style="height: 1rem;"></div>

	<label class="field-group">
		<span>Link (optioneel)</span>
		<input id="new-sponsor-link" type="url" placeholder="https://...">
	</label>

	<div style="height: 1.25rem;"></div>

	<p id="sponsor-form-error" class="error-message" hidden></p>

	<button type="submit" class="ghost-button">Toevoegen</button>

</form>

</section>


<div id="sponsor-list"></div>

</main>


</body>

</html>
