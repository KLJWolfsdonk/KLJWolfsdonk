<!doctype html>
<html lang="nl">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>
KLJ Wolfsdonk Admin | Producten
</title>

<link rel="stylesheet" href="./admin.css">

<script type="module" src="./products.js"></script>

</head>


<body>

<main class="admin-shell">

<header class="hero card">
<div class="hero-actions">
<div>
<p class="eyebrow">KLJ Wolfsdonk</p>
<h1>Producten</h1>
<p>Beheer het verhuurassortiment: prijzen, waarborg en voorraad.</p>
</div>
<div class="hero-nav">
<a href="./pages.html" class="ghost-button">Pagina's</a>
<a href="./index.html" class="ghost-button">Reservaties</a>
<a href="./navigation.html" class="ghost-button">Navigatie</a>
<a href="./signature.html" class="ghost-button">Handtekening</a>
<button type="button" id="logout-button" class="ghost-button" hidden>Uitloggen</button>
</div>
</div>
</header>


<section class="card">

<h2>Nieuw product</h2>

<form id="product-form">

	<div class="inline-fields">

		<label class="field-group">
			<span>Naam</span>
			<input id="new-naam" required>
		</label>

		<label class="field-group">
			<span>Categorie</span>
			<input id="new-categorie" required>
		</label>

	</div>

	<div style="height: 1rem;"></div>

	<label class="field-group">
		<span>Beschrijving</span>
		<input id="new-beschrijving">
	</label>

	<div style="height: 1rem;"></div>

	<label class="field-group">
		<span>Foto's</span>
		<input id="new-foto" type="file" accept="image/*" multiple>
	</label>

	<div style="height: 1rem;"></div>

	<div class="inline-fields">

		<label class="field-group">
			<span>Prijs per dag (&euro;)</span>
			<input id="new-prijs" type="number" min="0" step="0.01" required>
		</label>

		<label class="field-group">
			<span>Waarborg (&euro;)</span>
			<input id="new-waarborg" type="number" min="0" step="0.01" required>
		</label>

		<label class="field-group">
			<span>Voorraad</span>
			<input id="new-voorraad" type="number" min="0" step="1" required>
		</label>

	</div>

	<div style="height: 1.25rem;"></div>

	<p id="product-form-error" class="error-message" hidden></p>

	<button type="submit" class="ghost-button">Toevoegen</button>

</form>

</section>


<div id="product-manager-list"></div>

</main>


</body>

</html>
