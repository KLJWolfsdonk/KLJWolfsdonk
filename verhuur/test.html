<!doctype html>
<html lang="nl">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>KLJ Wolfsdonk | Verhuur test</title>
		<meta name="description" content="Testpagina voor het laden van verhuurproducten via ProductService." />
		<link rel="stylesheet" href="./verhuur.css" />
		<script type="module" src="./test.js"></script>
	</head>
	<body>
		<main class="app-shell">
			<header class="card hero">
				<p class="eyebrow">Testomgeving</p>
				<h1>Productoverzicht via service</h1>
				<p>Deze pagina laadt producten via <strong>ProductService</strong> en toont dynamische beschikbaarheid.</p>
			</header>

			<section class="card">
				<div class="toolbar" style="margin-bottom: 1rem;">
					<label>
						Begin datum
						<input id="start-date" type="date" />
					</label>
					<label>
						Eind datum
						<input id="end-date" type="date" />
					</label>
					<div>
						<button id="reload-button" type="button">Herlaad producten</button>
					</div>
				</div>
				<div id="status-message" aria-live="polite"></div>
			</section>

			<section class="card" id="product-list" aria-live="polite"></section>
		</main>
	</body>
</html>
